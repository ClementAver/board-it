<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board-It | Home</title>
  <link rel="stylesheet" href="./styles/pages/board.css">
</head>

<body>
  <header class="main-header">
    <div class="logo"></div>
    <nav>
      <ul>
        <li><a href="/index.html" class="rounded-full nav">Boards</a></li>
        <li><a href="./pages/contact.html" class="rounded-full nav">Contact</a></li>
      </ul>
    </nav>
  </header>
  <menu class="left-drawer open">
    <li>
      <button type="button" class="camera rounded flex-left gap-lg border-none"><svg xmlns="http://www.w3.org/2000/svg"
          width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-icon lucide-move">
          <path d="M12 2v20" />
          <path d="m15 19-3 3-3-3" />
          <path d="m19 9 3 3-3 3" />
          <path d="M2 12h20" />
          <path d="m5 9-3 3 3 3" />
          <path d="m9 5 3-3 3 3" />
        </svg><span class="label">Caméra</span></button>
    </li>
    <li>
      <button type="button" class="selector rounded flex-left gap-lg border-none"><svg xmlns="http://www.w3.org/2000/svg"
          width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-dashed-icon lucide-square-dashed">
          <path d="M5 3a2 2 0 0 0-2 2" />
          <path d="M19 3a2 2 0 0 1 2 2" />
          <path d="M21 19a2 2 0 0 1-2 2" />
          <path d="M5 21a2 2 0 0 1-2-2" />
          <path d="M9 3h1" />
          <path d="M9 21h1" />
          <path d="M14 3h1" />
          <path d="M14 21h1" />
          <path d="M3 9v1" />
          <path d="M21 9v1" />
          <path d="M3 14v1" />
          <path d="M21 14v1" />
        </svg><span class="label">Sélectionner</span></button>
    </li>
  </menu>
  <main class="board__wrapper">
    <button type="button" class="toggle-left-drawer-btn rounded-full flex-center bg-none border-none"
      aria-label="Déploie / repli le tiroir de gauche."></button>
  </main>
</body>

<script type="module" src="./scripts/pages/board.js"></script>

</html>
