<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board-It | Contact</title>
  <link rel="stylesheet" href="../styles/pages/contact.css">
  <meta name="color-scheme" content="light dark" />
</head>

<body>
  <header class="main-header">
    <img style="width: 3rem; height: 1.45rem; object-fit: cover; margin-right: auto;" src="../favicon.ico"
      alt="A cat pokes its head through a square cut out of the ceiling.">

    <button data-theme-switch-btn type="button" aria-label="Toggles Dark theme.">
      <div></div>
    </button>

    <nav>
      <ul>
        <li><a href="/index.html" class="rounded-full medium">Boards</a></li>
        <li><a href="./contact.html" class="rounded-full medium">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="w-screen flex justify-center items-center">
    <form class="flex-col gap-md w-full max-w-1024 h-fit m-lg">
      <h2 class="text-center">Contact</h2>
      <fieldset class="flex wrap gap-lg pl-lg mb-md">
        <legend>Identité</legend>

        <label class="flex-col min-w-128 w-quarter grow">
          Pseudonyme
          <div class="validated"><input type="text" name="username" minlength="3" placeholder="John_Doe" required></div>
        </label>

        <label class="flex-col min-w-128 w-quarter grow">
          Prénom
          <div class="validated"><input type="text" name="firstname" minlength="1" placeholder="John"></div>
        </label>

        <label class="flex-col grow">
          Nom
          <div class="validated"><input type="text" name="lastname" minlength="1" placeholder="Doe"></div>
        </label>
      </fieldset>

      <fieldset class="flex wrap gap-lg pl-lg mb-md">
        <legend>Coordonnées</legend>

        <label class="flex-col min-w-128 w-quarter grow">
          Courriel
          <div class="validated"><input type="email" name="email" placeholder="john-doe@email.me" required></div>
        </label>

        <label class="flex-col min-w-128 w-quarter grow">
          <span class="flex items-baseline gap-sm"><span class="truncate block">Téléphone</span><small
              class="light whitespace-nowrap">(ITU-T E.123)</small></span>
          <div class="validated"><input type="tel" name="tel" pattern="^\+[1-9][0-9]{5,14}$" placeholder="+33611223344">
          </div>
        </label>
      </fieldset>

      <label class="flex-col grow">
        Votre message
        <div class="validated"><textarea name="message" minlength="3" maxlength="1024"
            placeholder="Comment puis-je vous aider ?" spellcheck="true" required></textarea></div>
      </label>

      <button type="submit" class="rounded bd-none bold">Envoyer</button>
    </form>

    <script>
      const form = document.querySelector('form')
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(form)
        console.log(formData)
      })
    </script>
  </main>
</body>

<script type="module" src="../scripts/pages/contact.js"></script>

</html>
