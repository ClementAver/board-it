<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board-It | Contact</title>
  <link rel="stylesheet" href="../styles/pages/contact.css">
  <meta name="color-scheme" content="light dark" />
</head>

<body>
  <header class="main-header">
    <svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232.8 268.82">
      <defs>
        <style>
          .cls-1 {
            fill: currentColor;
          }

          .cls-2 {
            fill: #fd2;
          }

          .cls-3 {
            fill: #fa0;
          }
        </style>
      </defs>
      <title>Logo</title>
      <g id="Layer_2" data-name="Layer 2">
        <g id="Layer_1-2" data-name="Layer 1">
          <polygon class="cls-1" points="227.6 58.37 226.83 80.48 191.01 104.7 227.6 58.37" />
          <path class="cls-1"
            d="M222.26,93.29l-31.1,19.49L216.1,219.94,68.88,232.13h0C62.91,173,79.8,124.54,128.14,91.65V64.15l-13-23.53L0,48.43,42.4,268.82l190.4-42.4Z" />
          <polygon class="cls-1" points="128.34 19.63 118.18 28.64 128.34 52.15 128.34 19.63" />
          <polygon class="cls-2" points="190.85 0 136.46 5.22 128.14 158.74 133.77 162.45 190.85 0" />
          <polygon class="cls-3" points="190.85 0 230.02 38.1 140.48 163.07 133.77 162.45 190.85 0" />
          <circle class="cls-2" cx="123.26" cy="194.75" r="23.28" />
          <path class="cls-3" d="M128.14,201.11V188.29a12.8,12.8,0,1,1-10.23,5.08Z" />
        </g>
      </g>
    </svg>

    <button data-theme-switch-btn type="button" aria-label="Toggles Dark theme.">
      <div data-theme-switch-handle>
        <svg id="theme-sun" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M5 5l1 1M18 18l1 1M2 12h2M20 12h2M6 18l-1 1M19 5l-1 1" />
        </svg>

        <svg id="theme-moon" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-9-9v1a6 6 0 0 0 8 8z" />
        </svg>
      </div>
    </button>

    <nav>
      <ul>
        <li><a href="/index.html" class="rounded-full medium">Boards</a></li>
        <li><a href="./contact.html" class="rounded-full medium">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="w-screen flex justify-center items-center">
    <form class="flex-col gap-md w-full max-w-1024 h-fit m-lg">
      <h2 class="text-center">Contact</h2>
      <fieldset class="flex wrap gap-lg pl-lg mb-md">
        <legend>Identité</legend>

        <label class="flex-col min-w-128 w-quarter grow">
          Pseudonyme
          <div class="validated bounce-up"><input type="text" name="username" minlength="3" placeholder="John_Doe" required></div>
        </label>

        <label class="flex-col min-w-128 w-quarter grow">
          Prénom
          <div class="validated bounce-up"><input type="text" name="firstname" minlength="1" placeholder="John"></div>
        </label>

        <label class="flex-col grow">
          Nom
          <div class="validated bounce-up"><input type="text" name="lastname" minlength="1" placeholder="Doe" disabled></div>
        </label>
      </fieldset>

      <fieldset class="flex wrap gap-lg pl-lg mb-md">
        <legend>Coordonnées</legend>

        <label class="flex-col min-w-128 w-quarter grow">
          Courriel
          <div class="validated bounce-up"><input type="email" name="email" placeholder="john-doe@email.me" required></div>
        </label>

        <label class="flex-col min-w-128 w-quarter grow">
          <span class="flex items-baseline gap-sm"><span class="truncate block">Téléphone</span><small
              class="light whitespace-nowrap">(ITU-T E.123)</small></span>
          <div class="validated bounce-up"><input type="tel" name="tel" pattern="^\+[1-9][0-9]{5,14}$" placeholder="+33611223344">
          </div>
        </label>
      </fieldset>

      <label class="flex-col grow">
        Votre message
        <div class="validated"><textarea name="message" minlength="3" maxlength="1024"
            placeholder="Comment puis-je vous aider ?" spellcheck="true" required disabled></textarea></div>
      </label>

      <button type="submit" class="rounded bd-none bold" disabled>Envoyer</button>
    </form>

    <script>
      const form = document.querySelector('form')
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(form)
        console.log(formData)
      })
    </script>
  </main>
</body>

<script type="module" src="../scripts/pages/contact.js"></script>

</html>
