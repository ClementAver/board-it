<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board-It | Contact</title>
  <link rel="stylesheet" href="../styles/pages/contact.css">
  <meta name="color-scheme" content="light dark" />
</head>

<body>
  <header class="main-header">
    <a href="../index.html"><svg id="logo-header" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 177.13 218.04">
        <defs>
          <style>
            .cls-1 {
              fill: currentColor;
            }

            .cls-2 {
              fill: #fd2;
            }

            .cls-3 {
              fill: #fa0;
            }
          </style>
        </defs>
        <title>Asset 9</title>
        <g id="Layer_2" data-name="Layer 2">
          <g id="Layer_1-2" data-name="Layer 1">
            <polygon class="cls-1" points="171.93 58.37 171.16 80.48 135.34 104.7 171.93 58.37" />
            <path class="cls-1"
              d="M12.77,202.46a92.14,92.14,0,0,1-2.95-23.15c0-40.3,26-74.66,62.48-87.95V64.12L59.51,40.62,8,63.41,0,211.63l177.13-15.21L166.59,93.29l-31.1,19.49,24.94,77.16Z" />
            <polygon class="cls-1" points="72.67 19.63 62.51 28.64 72.67 52.15 72.67 19.63" />
            <polygon class="cls-2" points="135.18 0 80.79 5.22 72.47 158.74 78.1 162.45 135.18 0" />
            <polygon class="cls-3" points="135.18 0 174.35 38.1 84.81 163.07 78.1 162.45 135.18 0" />
            <circle class="cls-2" cx="67.59" cy="194.75" r="23.28" />
            <path class="cls-3" d="M70.43,214.06c15.33.88,23.28-26.82,9.79-34.2A36.35,36.35,0,0,1,70.43,214.06Z" />
          </g>
        </g>
      </svg></a>

    <button data-theme-switch-btn type="button" aria-label="Toggles Dark theme.">
      <div data-theme-switch-handle>
        <svg id="theme-sun" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M5 5l1 1M18 18l1 1M2 12h2M20 12h2M6 18l-1 1M19 5l-1 1" />
        </svg>

        <svg id="theme-moon" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round"
          stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-9-9v1a6 6 0 0 0 8 8z" />
        </svg>
      </div>
    </button>

    <nav>
      <ul>
        <li><a href="/index.html" class="rounded-full medium">Boards</a></li>
        <li><a href="./contact.html" class="rounded-full medium">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="w-screen flex justify-center items-center">
    <form class="flex-col gap-md w-full max-w-1024 h-fit m-lg">
      <h2 class="text-center">Contact</h2>
      <fieldset class="flex wrap gap-lg pl-lg mb-md">
        <legend>Identité</legend>

        <label class="flex-col min-w-128 w-quarter grow">
          Pseudonyme
          <div class="validated bounce-up"><input type="text" name="username" minlength="3" placeholder="John_Doe"
              required></div>
        </label>

        <label class="flex-col min-w-128 w-quarter grow">
          Prénom
          <div class="validated bounce-up"><input type="text" name="firstname" minlength="1" placeholder="John"></div>
        </label>

        <label class="flex-col grow">
          Nom
          <div class="validated bounce-up"><input type="text" name="lastname" minlength="1" placeholder="Doe" disabled>
          </div>
        </label>
      </fieldset>

      <fieldset class="flex wrap gap-lg pl-lg mb-md">
        <legend>Coordonnées</legend>

        <label class="flex-col min-w-128 w-quarter grow">
          Courriel
          <div class="validated bounce-up"><input type="email" name="email" placeholder="john-doe@email.me" required>
          </div>
        </label>

        <label class="flex-col min-w-128 w-quarter grow">
          <span class="flex items-baseline gap-sm"><span class="truncate block">Téléphone</span><small
              class="light whitespace-nowrap">(ITU-T E.123)</small></span>
          <div class="validated bounce-up"><input type="tel" name="tel" pattern="^\+[1-9][0-9]{5,14}$"
              placeholder="+33611223344">
          </div>
        </label>
      </fieldset>

      <label class="flex-col grow">
        Votre message
        <div class="validated"><textarea name="message" minlength="3" maxlength="1024"
            placeholder="Comment puis-je vous aider ?" spellcheck="true" required disabled></textarea></div>
      </label>

      <button type="submit" class="rounded bd-none bold" disabled>Envoyer</button>
    </form>

    <script>
      const form = document.querySelector('form')
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(form)
        console.log(formData)
      })
    </script>
  </main>
</body>

<script type="module" src="../scripts/pages/contact.js"></script>

</html>
