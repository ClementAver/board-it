<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board-It | Contact</title>
    <link rel="stylesheet" href="../styles/pages/contact.css" />
    <meta name="color-scheme" content="light dark" />
    <script type="module" src="../scripts/pages/contact.js"></script>
  </head>

  <body>
    <header role="banner" data-drawer="banner-drawer" data-open="false">
      <a
        href="../index.html"
        class="button flex flex-center no-dash px-md rounded-xs bg-transparent"
        style="font-size: 1rem"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
          <path
            d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
          />
        </svg>
      </a>
      <aeee-tooltip class="m-sm anchor-right">
        <small>Page d'accueil</small>
      </aeee-tooltip>

      <div id="banner-wrapper">
        <nav>
          <ul>
            <li>
              <a href="./board.html" class="rounded-full medium">Board</a>
            </li>
            <li>
              <a href="./contact.html" class="rounded-full medium">Contact</a>
            </li>
          </ul>
        </nav>
      </div>

      <aeee-theme-switch class="ml-auto">
        <button
          data-theme-switch
          type="button"
          aria-label="Toggles Dark theme."
          class="no-dash"
        >
          <div data-theme-switch-handle>
            <svg
              title="theme-sun"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              class="h-16"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M5 5l1 1M18 18l1 1M2 12h2M20 12h2M6 18l-1 1M19 5l-1 1"
              />
            </svg>

            <svg
              title="theme-moon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              class="h-16"
            >
              <path d="M21 12a9 9 0 1 1-9-9v1a6 6 0 0 0 8 8z" />
            </svg>
          </div>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
          <small>Thème sombre</small>
        </aeee-tooltip>
      </aeee-theme-switch>

      <button
        data-switch="banner-drawer"
        type="button"
        aria-label="Shows/hides the menu on smaller screen widths."
        class="rounded-full bg-transparent text-swath no-dash h-24"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-16"
        >
          <path d="M4 5h16" />
          <path d="M4 12h16" />
          <path d="M4 19h16" />
        </svg>
      </button>
      <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
        <small>Afficher&thinsp;/&thinsp;masquer le menu principal.</small>
      </aeee-tooltip>
    </header>

    <main class="w-screen flex flex-center">
      <form
        action=""
        enctype="multipart/form-data"
        class="flex-col gap-md w-full max-w-1024 h-fit m-lg"
      >
        <h2 class="text-center">Contact</h2>
        <fieldset class="flex wrap gap-lg pl-lg mb-md">
          <legend>Identité</legend>

          <label class="flex-col min-w-128 w-quarter grow">
            Pseudonyme
            <div class="validated bounce-up">
              <input
                type="text"
                name="username"
                minlength="3"
                placeholder="John_Doe"
                required
              />
            </div>
          </label>

          <label class="flex-col min-w-128 w-quarter grow">
            Prénom
            <div class="validated bounce-up">
              <input
                type="text"
                name="firstname"
                minlength="1"
                placeholder="John"
              />
            </div>
          </label>

          <label class="flex-col grow">
            Nom
            <div class="validated bounce-up">
              <input
                type="text"
                name="lastname"
                minlength="1"
                placeholder="Doe"
                disabled
              />
            </div>
          </label>
        </fieldset>

        <fieldset class="flex wrap gap-lg pl-lg mb-md">
          <legend>Coordonnées</legend>

          <label class="flex-col min-w-128 w-quarter grow">
            Courriel
            <div class="validated bounce-up">
              <input
                type="email"
                name="email"
                placeholder="john-doe@email.me"
                required
              />
            </div>
          </label>

          <label class="flex-col min-w-128 w-quarter grow">
            <span class="flex items-baseline gap-sm">
              <span class="truncate block">Téléphone</span>
              <small class="light whitespace-nowrap">(ITU-T E.123) </small>
            </span>
            <div class="validated bounce-up">
              <input
                type="tel"
                name="tel"
                pattern="^\+[1-9][0-9]{5,14}$"
                placeholder="+33611223344"
              />
            </div>
          </label>
        </fieldset>

        <label class="flex-col grow mb-md">
          Votre message
          <div class="validated">
            <textarea
              name="message"
              minlength="3"
              maxlength="1024"
              placeholder="Comment puis-je vous aider ?"
              spellcheck="true"
              required
              disabled
            ></textarea>
          </div>
        </label>

        <div class="spring-wrapper rounded-xs w-full mx-auto">
          <button type="submit" class="rounded-xs bold w-full px-lg">
            Envoyer
          </button>
        </div>
      </form>

      <script>
        const form = document.querySelector("form");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const formData = new FormData(form);
          console.info(formData);
        });
      </script>
    </main>
  </body>
</html>
