<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board-It | Board</title>
    <link rel="stylesheet" href="../styles/pages/board.css" />
    <meta name="color-scheme" content="light dark" />
    <script type="module" src="../scripts/pages/board.js"></script>
  </head>

  <body>
    <header role="banner" data-drawer="banner-drawer" data-open="false">
      <a
        href="../index.html"
        class="button flex flex-center no-dash px-md rounded-xs bg-transparent"
        style="font-size: 1rem"
      >
        <aeee-svg data-href="../assets/icons/sprites.svg#house"></aeee-svg>
      </a>
      <aeee-tooltip class="m-sm anchor-right">
        <small>Page d'accueil</small>
      </aeee-tooltip>

      <div id="banner-wrapper">
        <menu>
          <li>
            <button
              data-anchor
              type="button"
              popovertarget="file-menu"
              interestfor="file-menu"
            >
              <!-- ⇈ popovertargetaction="file-menu" || interestfor="file-menu" -->
              Fichier ↴
            </button>
            <div
              id="file-menu"
              popover
              data-target
              class="dropdown-menu anchor-bottom-sr"
            >
              <form
                is="aeee-upload-work-file-form"
                action=""
                enctype="multipart/form-data"
              >
                <aeee-file-input class="w-full">
                  <input
                    id="upload-work-file-input"
                    name="json"
                    type="file"
                    accept="application/JSON"
                    tabindex="-1"
                  />
                  <label
                    for="upload-work-file-input"
                    class="button"
                    tabindex="0"
                  >
                    <aeee-svg
                      data-href="../assets/icons/sprites.svg#file-up"
                    ></aeee-svg>
                    <span>Téléverser</span>
                  </label>
                </aeee-file-input>
              </form>

              <form
                is="aeee-download-workfile-form"
                action=""
                enctype="multipart/form-data"
              >
                <a
                  id="download-workfile-anchor"
                  href="#"
                  download="file_name.json"
                  tabindex="-1"
                  class="sr-only"
                ></a>
                <button type="submit">
                  <aeee-svg
                    data-href="../assets/icons/sprites.svg#file-down"
                  ></aeee-svg>
                  <span>Télécharger</span>
                </button>
              </form>

              <button
                data-anchor
                type="button"
                popovertarget="file-menu-more"
                interestfor="file-menu-more"
              >
                <span>Plus d'options ↴</span>
              </button>
              <div
                id="file-menu-more"
                popover
                data-target
                class="dropdown-menu anchor-right-sb"
              >
                <button type="button">
                  <span>Renommer</span>
                </button>

                <button type="button">
                  <aeee-svg
                    data-href="../assets/icons/sprites.svg#trash-2"
                  ></aeee-svg>
                  <span>Supprimer</span>
                </button>
              </div>
            </div>
          </li>

          <li>
            <button
              data-anchor
              popovertarget="picture-menu"
              interestfor="picture-menu"
              type="button"
              class="mr-auto"
            >
              Image ↴
            </button>
            <div
              id="picture-menu"
              popover
              data-target
              class="dropdown-menu anchor-bottom-sr"
            >
              <button
                data-trigger="image-upload-dialog"
                data-action="showModal"
                type="button"
              >
                <span>Importer</span>
              </button>
            </div>
          </li>

          <li>
            <button
              type="button"
              data-anchor
              popovertarget="interface-menu"
              interestfor="interface-menu"
            >
              Interface ↴
            </button>
            <div
              id="interface-menu"
              popover
              data-target
              class="dropdown-menu anchor-bottom-sr"
            >
              <button
                data-anchor
                type="button"
                popovertarget="interface-menu-drawer-more"
                interestfor="interface-menu-drawer-more"
              >
                <span>Afficher&thinsp;/&thinsp;masquer ↴</span>
              </button>
              <div
                id="interface-menu-drawer-more"
                popover
                data-target
                class="dropdown-menu anchor-right-sb"
              >
                <button
                  data-switch="right-drawer"
                  type="button"
                  aria-label="Extends/retracts the right drawer."
                  class="no-dash"
                >
                  <span>Tiroir droit</span>
                </button>
              </div>
            </div>
          </li>
        </menu>

        <nav>
          <ul>
            <li>
              <a href="./board.html" class="rounded-full medium">Board</a>
            </li>
            <li>
              <a href="./contact.html" class="rounded-full medium">Contact</a>
            </li>
          </ul>
        </nav>
      </div>

      <aeee-theme-switch class="ml-auto">
        <button
          data-theme-switch
          type="button"
          aria-label="Toggles Dark theme."
          class="no-dash"
        >
          <div data-theme-switch-handle>
            <aeee-svg
              data-href="../assets/icons/sprites.svg#sun"
              data-classes="h-16"
            ></aeee-svg>
            <aeee-svg
              data-href="../assets/icons/sprites.svg#moon"
              data-classes="h-16"
            ></aeee-svg>
          </div>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
          <small>Thème sombre</small>
        </aeee-tooltip>
      </aeee-theme-switch>

      <button
        data-switch="banner-drawer"
        type="button"
        aria-label="Shows/hides the menu on smaller screen widths."
        class="rounded-full bg-transparent text-swath no-dash h-24"
      >
        <aeee-svg
          data-href="../assets/icons/sprites.svg#menu"
          data-classes="h-16"
        ></aeee-svg>
      </button>
      <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
        <small>Afficher&thinsp;/&thinsp;masquer le menu principal.</small>
      </aeee-tooltip>
    </header>

    <main id="main-board">
      <aeee-drag-sorter>
        <aeee-drag-sorter draggable="true">
          <p class="truncate" style="grid-column: 1/-1">
            Le lion, roi de la jungle
          </p>
          <aeee-draggable>
            <aeee-thumbnail
              data-source="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
              data-alternate="The king of the jungle."
              data-caption="Lives in the savana."
              data-is-selectable="true"
            ></aeee-thumbnail>
          </aeee-draggable>

          <aeee-draggable>
            <aeee-thumbnail
              data-source="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/011_The_lion_king_Tryggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg/960px-011_The_lion_king_Tryggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg"
              data-alternate="The king of the jungle."
              data-caption="Lives in the savana."
              data-is-selectable="true"
            ></aeee-thumbnail>
          </aeee-draggable>

          <aeee-draggable>
            <aeee-thumbnail
              data-source="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
              data-alternate="The king of the jungle."
              data-caption="Lives in the savana."
              data-is-selectable="true"
            ></aeee-thumbnail>
          </aeee-draggable>
        </aeee-drag-sorter>
        <aeee-drag-sorter draggable="true">
          <p class="truncate" style="grid-column: 1/-1">
            Le chat, roi du monde
          </p>
          <aeee-draggable>
            <aeee-thumbnail
              data-source="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
              data-alternate="The king of the jungle."
              data-caption="Lives in the savana."
              data-is-selectable="true"
            ></aeee-thumbnail>
          </aeee-draggable>

          <aeee-draggable>
            <aeee-thumbnail
              data-source="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/011_The_lion_king_Tryggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg/960px-011_The_lion_king_Tryggve_in_the_Serengeti_National_Park_Photo_by_Giles_Laurent.jpg"
              data-alternate="The king of the jungle."
              data-caption="Lives in the savana."
              data-is-selectable="true"
            ></aeee-thumbnail>
          </aeee-draggable>

          <aeee-draggable>
            <aeee-thumbnail
              data-source="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
              data-alternate="The king of the jungle."
              data-caption="Lives in the savana."
              data-is-selectable="true"
            ></aeee-thumbnail>
          </aeee-draggable>
        </aeee-drag-sorter>
      </aeee-drag-sorter>
    </main>

    <menu
      data-drawer="right-drawer"
      data-open="true"
      class="right"
      style="grid-area: right-drawer"
    >
      <aeee-details data-name="right-drawer-details" class="mb-sm">
        <p data-summary class="text-swath medium truncate">
          Téléverser des images
        </p>
        <div>
          <form
            is="aeee-upload-image-form"
            action="http://127.0.0.1:8698/media"
            method="post"
            enctype="multipart/form-data"
            class="mt-sm mb-md"
          >
            <aeee-file-input>
              <input
                id="upload-image-input"
                type="file"
                accept="image/png, image/jpeg"
                name="image"
                tabindex="-1"
                multiple
              />
              <label for="upload-image-input" class="button swath" tabindex="0">
                <span>Importer des images</span>
              </label>
              <p>
                <small>–</small>
              </p>
            </aeee-file-input>

            <div class="spring-wrapper rounded-xs">
              <button class="rounded-xs bold swath" type="submit">
                Importer
              </button>
            </div>
          </form>
        </div>
      </aeee-details>

      <aeee-details data-name="right-drawer-details" class="mb-sm">
        <p data-summary class="text-swath medium truncate">
          Téléverser des images
        </p>
        <div>
          <form class="mt-sm mb-md flex-col gap-lg">
            <aeee-drag-and-drop
              data-accept="image/png"
              data-disabled="false"
              data-drop-zone-text="Déposer ou coller votre image ici"
              data-id="drag-and-drop-file-input"
              data-label="Sélectionner un fichier"
              data-multiple="true"
              data-required="true"
              data-reset-button-text="réinitialiser"
              data-wrong-file-format-message="Format de fichier non pris en charge"
            ></aeee-drag-and-drop>

            <div class="spring-wrapper rounded-xs">
              <button class="rounded-xs bold swath" type="submit">
                Importer
              </button>
            </div>
          </form>
        </div>
      </aeee-details>
    </menu>

    <dialog is="aeee-dialog" id="image-upload-dialog" autofocus closedby="any">
      <header>
        <p>Importer une image</p>
        <button
          data-trigger="image-upload-dialog"
          data-action="close"
          type="button"
          aria-label="Fermer la boîte de dialogue modale."
          class="no-dash"
        >
          <aeee-svg
            data-href="../assets/icons/sprites.svg#minimize-2"
          ></aeee-svg>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
          <small>Fermer la boîte de dialogue modale.</small>
        </aeee-tooltip>
      </header>

      <form
        is="aeee-selection-image-form"
        action=""
        enctype="multipart/form-data"
      >
        <aeee-gallery class="w-full grow">
          <aeee-pagination
            class="ml-auto"
            data-page="1"
            data-max="999"
          ></aeee-pagination>

          <div data-gallery-wrapper>
            <div class="spring-wrapper rounded-sm">
              <aeee-thumbnail
                data-source="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
                data-alternate="The king of the jungle."
                data-caption="Lives in the savana."
                data-is-selectable="true"
              ></aeee-thumbnail>
            </div>
          </div>
        </aeee-gallery>

        <script>
          const wrapper = document.querySelector("[data-gallery-wrapper]");
          const thumbnail = document.querySelector("div:has(> aeee-thumbnail)");

          let count = 0;
          while (count < 10) {
            wrapper.appendChild(thumbnail.cloneNode(true));
            count++;
          }
        </script>

        <div class="spring-wrapper rounded-xs mb-md">
          <button class="rounded-xs bold" type="submit">Importer</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
