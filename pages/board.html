<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board-It | Board</title>
    <link rel="stylesheet" href="../styles/pages/board.css" />
    <meta name="color-scheme" content="light dark" />
    <script type="module" src="../scripts/pages/board.js"></script>
  </head>

  <body>
    <header role="banner" data-drawer="banner-drawer" data-open="false">
      <a href="../index.html" id="logo-button" class="no-dash">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 319.66 393.49"
          class="h-24"
        >
          <defs>
            <style>
              .cls-1 {
                fill: currentColor;
              }

              .cls-2 {
                fill: #fd2;
              }

              .cls-3 {
                fill: #fa0;
              }
            </style>
          </defs>
          <title>Point d'exclamation dans un encadré stylisé</title>
          <g id="Layer_2" data-name="Layer 2">
            <g id="Layer_1-2" data-name="Layer 1">
              <polygon
                class="cls-1"
                points="310.28 105.33 308.89 145.25 244.24 188.96 310.28 105.33"
              />
              <path
                class="cls-1"
                d="M175,352.49l114.52-9.71-45-139.25,56.13-35.17,19,186.12-147,12.62A51,51,0,0,0,175,352.49Z"
              />
              <path
                class="cls-1"
                d="M69.88,361.41l-46.84,4a166.11,166.11,0,0,1-5.31-41.78c0-72.73,46.9-134.74,112.74-158.73V115.71L107.4,73.31l-93,41.12L0,381.92l74.74-6.41A49.42,49.42,0,0,1,69.88,361.41Z"
              />
              <polygon
                class="cls-1"
                points="131.16 35.42 112.82 51.68 131.16 94.12 131.16 35.42"
              />
              <polygon
                class="cls-2"
                points="243.95 0 145.79 9.43 130.79 286.47 140.95 293.17 243.95 0"
              />
              <polygon
                class="cls-3"
                points="243.95 0 314.64 68.75 153.06 294.29 140.95 293.17 243.95 0"
              />
              <circle class="cls-2" cx="121.99" cy="351.46" r="42.02" />
              <path
                class="cls-3"
                d="M127.11,386.31c27.65,1.6,42-48.39,17.66-61.71A65.61,65.61,0,0,1,127.11,386.31Z"
              />
            </g>
          </g>
        </svg>
      </a>
      <aeee-tooltip class="m-sm anchor-right">
        <small>Page d'accueil</small>
      </aeee-tooltip>

      <div id="banner-wrapper">
        <menu>
          <li>
            <button
              data-anchor
              type="button"
              popovertarget="file-menu"
              interestfor="file-menu"
            >
              <!-- ⇈ popovertargetaction="file-menu" || interestfor="file-menu" -->
              Fichier ↴
            </button>
            <div
              id="file-menu"
              popover
              data-target
              class="dropdown-menu anchor-bottom-sr"
            >
              <form
                is="aeee-upload-work-file-form"
                action=""
                enctype="multipart/form-data"
              >
                <aeee-file-input class="w-full">
                  <input
                    id="upload-work-file-input"
                    name="json"
                    type="file"
                    accept="application/JSON"
                    tabindex="-1"
                  />
                  <label
                    for="upload-work-file-input"
                    class="button-chameleon"
                    tabindex="0"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
                      />
                      <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                      <path d="M12 12v6" />
                      <path d="m15 15-3-3-3 3" />
                    </svg>
                    <span>Téléverser</span>
                  </label>
                </aeee-file-input>
              </form>

              <form
                is="aeee-download-workfile-form"
                action=""
                enctype="multipart/form-data"
              >
                <a
                  id="download-workfile-anchor"
                  href="#"
                  download="file_name.json"
                  tabindex="-1"
                  class="sr-only"
                ></a>
                <button type="submit">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
                    />
                    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                    <path d="M12 18v-6" />
                    <path d="m9 15 3 3 3-3" />
                  </svg>
                  <span>Télécharger</span>
                </button>
              </form>

              <button
                data-anchor
                type="button"
                popovertarget="file-menu-more"
                interestfor="file-menu-more"
              >
                <span>Plus d'options ↴</span>
              </button>
              <div
                id="file-menu-more"
                popover
                data-target
                class="dropdown-menu anchor-right-sb"
              >
                <button type="button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"
                    />
                    <circle cx="7.5" cy="7.5" r=".5" fill="currentColor" />
                  </svg>
                  <span>Renommer</span>
                </button>

                <button type="button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                  </svg>
                  <span>Supprimer</span>
                </button>
              </div>
            </div>
          </li>

          <li>
            <button
              data-anchor
              popovertarget="picture-menu"
              interestfor="picture-menu"
              type="button"
              class="mr-auto"
            >
              Image ↴
            </button>
            <div
              id="picture-menu"
              popover
              data-target
              class="dropdown-menu anchor-bottom-sr"
            >
              <button
                data-trigger="image-upload-dialog"
                data-action="showModal"
                type="button"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
                  />
                  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                  <circle cx="10" cy="12" r="2" />
                  <path d="m20 17-1.296-1.296a2.41 2.41 0 0 0-3.408 0L9 22" />
                </svg>
                <span>Importer</span>
              </button>
            </div>
          </li>

          <li>
            <button
              type="button"
              data-anchor
              popovertarget="interface-menu"
              interestfor="interface-menu"
            >
              Interface ↴
            </button>
            <div
              id="interface-menu"
              popover
              data-target
              class="dropdown-menu anchor-bottom-sr"
            >
              <button
                data-anchor
                type="button"
                popovertarget="interface-menu-drawer-more"
                interestfor="interface-menu-drawer-more"
              >
                <span>Afficher&thinsp;/&thinsp;masquer ↴</span>
              </button>
              <div
                id="interface-menu-drawer-more"
                popover
                data-target
                class="dropdown-menu anchor-right-sb"
              >
                <button
                  data-switch="left-drawer"
                  type="button"
                  aria-label="Extends/retracts the left drawer."
                  class="no-dash"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M8 3 4 7l4 4" />
                    <path d="M4 7h16" />
                    <path d="m16 21 4-4-4-4" />
                    <path d="M20 17H4" />
                  </svg>
                  <span>Tiroir gauche</span>
                </button>

                <button
                  data-switch="right-drawer"
                  type="button"
                  aria-label="Extends/retracts the right drawer."
                  class="no-dash"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M8 3 4 7l4 4" />
                    <path d="M4 7h16" />
                    <path d="m16 21 4-4-4-4" />
                    <path d="M20 17H4" />
                  </svg>
                  <span>Tiroir droit</span>
                </button>
              </div>
            </div>
          </li>
        </menu>

        <nav>
          <ul>
            <li>
              <a href="./board.html" class="rounded-full medium">Board</a>
            </li>
            <li>
              <a href="./contact.html" class="rounded-full medium">Contact</a>
            </li>
          </ul>
        </nav>
      </div>

      <aeee-theme-switch class="ml-auto">
        <button
          data-theme-switch
          type="button"
          aria-label="Toggles Dark theme."
          class="no-dash"
        >
          <div data-theme-switch-handle>
            <svg
              title="theme-sun"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              class="h-16"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M5 5l1 1M18 18l1 1M2 12h2M20 12h2M6 18l-1 1M19 5l-1 1"
              />
            </svg>

            <svg
              title="theme-moon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              class="h-16"
            >
              <path d="M21 12a9 9 0 1 1-9-9v1a6 6 0 0 0 8 8z" />
            </svg>
          </div>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
          <small>Thème sombre</small>
        </aeee-tooltip>
      </aeee-theme-switch>

      <button
        data-switch="banner-drawer"
        type="button"
        aria-label="Shows/hides the menu on smaller screen widths."
        class="rounded-full bd-transparent bg-transparent text-swath no-dash h-24"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-16"
        >
          <path d="M4 5h16" />
          <path d="M4 12h16" />
          <path d="M4 19h16" />
        </svg>
      </button>
      <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
        <small>Afficher&thinsp;/&thinsp;masquer le menu principal.</small>
      </aeee-tooltip>
    </header>

    <menu
      data-drawer="left-drawer"
      data-open="true"
      class="left"
      style="grid-area: left-drawer"
    >
      <li>
        <button
          type="button"
          data-tool="camera"
          class="flex rounded-xs bd-transparent w-full no-dash py-md"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="transform: translateX(0.05rem)"
          >
            <path
              d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"
            />
            <rect x="2" y="6" width="14" height="12" rx="2" />
          </svg>
          <span class="sr-only">Caméra</span>
        </button>

        <aeee-tooltip class="m-sm anchor-right">
          <small>Caméra</small>
        </aeee-tooltip>
      </li>

      <li>
        <button
          type="button"
          data-tool="selector"
          class="flex rounded-xs bd-transparent w-full no-dash py-md"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 3a2 2 0 0 0-2 2" />
            <path d="M19 3a2 2 0 0 1 2 2" />
            <path d="M21 19a2 2 0 0 1-2 2" />
            <path d="M5 21a2 2 0 0 1-2-2" />
            <path d="M9 3h1" />
            <path d="M9 21h1" />
            <path d="M14 3h1" />
            <path d="M14 21h1" />
            <path d="M3 9v1" />
            <path d="M21 9v1" />
            <path d="M3 14v1" />
            <path d="M21 14v1" />
          </svg>
          <span class="sr-only">Sélectionner</span>
        </button>
        <aeee-tooltip class="m-sm anchor-right">
          <small>Sélectionner</small>
        </aeee-tooltip>
      </li>
    </menu>

    <!-- 🚧🚧🚧🚧🚧🚧🚧 -->
    <menu
      data-drawer="right-drawer"
      data-open="true"
      class="right"
      style="grid-area: right-drawer"
    >
      <details name="right-drawer-details" class="mb-sm">
        <summary>
          <span>Téléverser des images</span>
        </summary>
        <form
          is="aeee-upload-image-form"
          action=""
          enctype="multipart/form-data"
          class="p-lg"
        >
          <aeee-file-input>
            <input
              id="upload-image-input"
              type="file"
              accept="image/png, image/jpeg"
              name="image"
              tabindex="-1"
              multiple
            />
            <label
              for="upload-image-input"
              class="button-chameleon swath"
              tabindex="0"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
                />
                <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                <path d="M12 12v6" />
                <path d="m15 15-3-3-3 3" />
              </svg>
              <span>Importer des images <small>(.png)</small></span>
            </label>
            <p>
              <small>–</small>
            </p>
          </aeee-file-input>

          <div class="spring-wrapper rounded-xs">
            <button class="rounded-xs bold swath" type="submit">
              Importer
            </button>
          </div>
        </form>
      </details>
    </menu>
    <!-- 🚧🚧🚧🚧🚧🚧🚧 -->

    <main id="canvas-wrapper">
      <menu
        id="camera-widget"
        aria-label="Camera widget"
        class="widget max-w-full wrap"
      >
        <button type="button" data-widget="pan" class="rounded-xs no-dash">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aira-label="Allows the user to select the camera and view the zoom level (%)."
          >
            <path d="M12 2v20" />
            <path d="m15 19-3 3-3-3" />
            <path d="m19 9 3 3-3 3" />
            <path d="M2 12h20" />
            <path d="m5 9-3 3 3 3" />
            <path d="m9 5 3-3 3 3" />
          </svg>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom">
          <small>Déplacer la caméra</small>
        </aeee-tooltip>

        <button type="button" data-widget="zoom" class="rounded-xs no-dash">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom">
          <small>Zoomer</small>
        </aeee-tooltip>

        <div>
          <input
            type="number"
            name="zoom-indicator"
            step="1"
            min="2"
            max="500"
            data-widget="zoom-indicator"
            class="h-full"
          />
          <span class="unit">%</span>
        </div>

        <button
          type="button"
          data-widget="frame-all"
          class="rounded-xs no-dash"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-label="Allows the user to reframe the camera to show the entire content."
          >
            <path d="M3 7V5a2 2 0 0 1 2-2h2" />
            <path d="M17 3h2a2 2 0 0 1 2 2v2" />
            <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
            <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
            <rect width="10" height="8" x="7" y="8" rx="1" />
          </svg>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom-sr">
          <small>Plan d'ensemble</small>
        </aeee-tooltip>
      </menu>
    </main>

    <dialog is="aeee-dialog" id="image-upload-dialog" autofocus closedby="any">
      <button
        data-trigger="image-upload-dialog"
        data-action="close"
        type="button"
        class="rounded-full bd-transparent bg-transparent text-secondary ml-auto p-md"
        aria-label="Fermer la boîte de dialogue modale."
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m14 10 7-7" />
          <path d="M20 10h-6V4" />
          <path d="m3 21 7-7" />
          <path d="M4 14h6v6" />
        </svg>
      </button>
      <p>Importer une image</p>

      <form
        is="aeee-selection-image-form"
        action=""
        enctype="multipart/form-data"
      >
        <aeee-gallery class="w-full grow">
          <aeee-pagination
            class="ml-auto"
            data-page="1"
            data-max="999"
          ></aeee-pagination>

          <div data-gallery-wrapper>
            <div class="spring-wrapper rounded-sm">
              <aeee-thumbnail
                data-source="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
                data-alternate="The king of the jungle."
                data-caption="Lives in the savana."
                data-is-selectable="true"
              />
            </div>

            <div class="spring-wrapper rounded-full">
              <aeee-thumbnail
                data-source="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Portrait_of_a_red_fox_in_Rautas_fj%C3%A4llurskog.jpg/2560px-Portrait_of_a_red_fox_in_Rautas_fj%C3%A4llurskog.jpg"
                data-alternate="The king of the jungle."
                data-caption="Lives in the savana."
                data-is-rounded="true"
              />
            </div>
          </div>
        </aeee-gallery>

        <script>
          const wrapper = document.querySelector("[data-gallery-wrapper]");
          const thumbnail = document.querySelector("div:has(> aeee-thumbnail)");

          let count = 0;
          while (count < 10) {
            wrapper.appendChild(thumbnail.cloneNode(true));
            count++;
          }
        </script>

        <div class="spring-wrapper rounded-xs">
          <button class="rounded-xs bold" type="submit">Importer</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
