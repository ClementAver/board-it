<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEV | Sandbox</title>
    <link rel="stylesheet" href="../styles/pages/sandbox.css" />
    <meta name="color-scheme" content="light dark" />
    <script type="module" src="../scripts/pages/sandbox.js"></script>
  </head>

  <body>
    <header role="banner" data-drawer="banner-drawer" data-open="false">
      <a
        href="../index.html"
        class="button flex flex-center no-dash px-md rounded-xs bg-transparent"
        style="font-size: 1rem"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
          <path
            d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
          />
        </svg>
      </a>
      <aeee-tooltip class="m-sm anchor-right">
        <small>Page d'accueil</small>
      </aeee-tooltip>

      <div id="banner-wrapper">
        <nav>
          <ul>
            <li>
              <a href="./board.html" class="rounded-full medium">Board</a>
            </li>
            <li>
              <a href="./contact.html" class="rounded-full medium">Contact</a>
            </li>
          </ul>
        </nav>
      </div>

      <aeee-theme-switch class="ml-auto">
        <button
          data-theme-switch
          type="button"
          aria-label="Toggles Dark theme."
          class="no-dash"
        >
          <div data-theme-switch-handle>
            <svg
              title="theme-sun"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              class="h-16"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M5 5l1 1M18 18l1 1M2 12h2M20 12h2M6 18l-1 1M19 5l-1 1"
              />
            </svg>

            <svg
              title="theme-moon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              class="h-16"
            >
              <path d="M21 12a9 9 0 1 1-9-9v1a6 6 0 0 0 8 8z" />
            </svg>
          </div>
        </button>
        <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
          <small>Thème sombre</small>
        </aeee-tooltip>
      </aeee-theme-switch>

      <button
        data-switch="banner-drawer"
        type="button"
        aria-label="Shows/hides the menu on smaller screen widths."
        class="rounded-full bg-transparent text-swath no-dash h-24"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="h-16"
        >
          <path d="M4 5h16" />
          <path d="M4 12h16" />
          <path d="M4 19h16" />
        </svg>
      </button>
      <aeee-tooltip class="m-sm anchor-bottom-sr whitespace-nowrap">
        <small>Afficher&thinsp;/&thinsp;masquer le menu principal.</small>
      </aeee-tooltip>
    </header>

    <main class="p-lg">
      <button id="count-btn" type="button" class="rounded-xs mb-lg"></button>

      <form action="" enctype="multipart/form-data" class="ml-auto mr-lg mb-lg">
        <p>
          <label for="pet-select" class="sr-only">Select pet:</label>
          <select id="pet-select" class="rounded-xs py-sm w-256">
            <button>
              <selectedcontent></selectedcontent>
            </button>

            <option class="rounded-xs py-sm" value="">
              Please select a pet
            </option>
            <option class="rounded-xs py-sm" value="cat">
              <span class="option-label">Cat</span>
            </option>
            <option class="rounded-xs py-sm" value="dog">
              <span class="option-label">Dog</span>
            </option>
            <option class="rounded-xs py-sm" value="hamster">
              <span class="option-label">Hamster</span>
            </option>
            <option class="rounded-xs py-sm" value="chicken">
              <span class="option-label">Chicken</span>
            </option>
            <option class="rounded-xs py-sm" value="fish">
              <span class="option-label">Fish</span>
            </option>
            <option class="rounded-xs py-sm" value="snake">
              <span class="option-label">Snake</span>
            </option>
          </select>
        </p>
      </form>
    </main>
  </body>
</html>
